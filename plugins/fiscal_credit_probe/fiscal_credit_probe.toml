id = "fiscal_credit_probe"
name = "Fiscal/credit boundary probe"
version = "0.1"
module = "fiscal_credit_probe.dll"

[settings]
version = 1

[[settings.fields]]
key = "debug"
type = "bool"
label = "Enable boundary-probe diagnostics"
help = "Write read-only BEFORE/AFTER treasury and destination-bank CSV around PayDailyInterest (issue #29). Disabled by default."
default = false
advanced = true
argv = { option = "-smedley-probe-debug", codec = "bool_01" }
